name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/knowledge/wechat/skills/wechat-article/scripts/requirements.txt
      - run: pnpm verify
      # `pnpm verify` is an aggregate, and this job's log is not readable through the public
      # API from outside the repository, so a red run used to say nothing but "exit code 1".
      # Re-run the stages on failure and publish the first failing one as a check annotation,
      # which stays readable without repository access. A stage that passes here was flaky.
      - name: Report the failing stage
        if: failure()
        shell: bash
        run: |
          for stage in lint typecheck assets:check dsh:boundary test:unit build; do
            if pnpm "$stage" > "/tmp/stage-$stage.log" 2>&1; then
              echo "stage $stage passed on retry"
              continue
            fi
            message=$(tail -c 3000 "/tmp/stage-$stage.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=stage $stage::$message"
            exit 1
          done

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/knowledge/wechat/skills/wechat-article/scripts/requirements.txt
      - run: pnpm verify:portable
      # Same rationale as the quality job: make the failing stage readable from a public run.
      - name: Report the failing stage
        if: failure()
        shell: bash
        run: |
          for stage in typecheck assets:check test:unit build; do
            if pnpm "$stage" > "/tmp/stage-$stage.log" 2>&1; then
              echo "stage $stage passed on retry"
              continue
            fi
            message=$(tail -c 3000 "/tmp/stage-$stage.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=stage $stage::$message"
            exit 1
          done

  native-dsh:
    name: Packaged DSH Web integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for the official DSH Web smoke
        run: pnpm exec playwright install --with-deps chrome
      # `pipefail` matters: without it the pipeline reports `tee`'s status and a failing smoke
      # would still turn this step green.
      - name: Run pnpm test:dsh
        run: |
          set -o pipefail
          pnpm test:dsh 2>&1 | tee /tmp/test-dsh.log
      # Same rationale as the other jobs: this run's log is not readable from outside the
      # repository, and `pnpm test:dsh` is one aggregate command with no sub-stages to re-run,
      # so the tail of its output is republished as an annotation instead.
      - name: Report the smoke failure
        if: failure()
        shell: bash
        run: |
          message=$(tail -c 3000 /tmp/test-dsh.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=test:dsh::$message"
